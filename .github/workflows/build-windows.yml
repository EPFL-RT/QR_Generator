name: Build Windows EXE

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Compile Python sources
        run: python -m compileall qr_gen.py qr_generator

      - name: Build executable
        run: python -m PyInstaller QR_Generator.spec --noconfirm --clean

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/QR Code Generator.exe")) {
            throw "Expected executable was not created."
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR-Code-Generator-Windows
          path: "dist/QR Code Generator.exe"
          if-no-files-found: error
