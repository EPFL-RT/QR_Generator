[qr]
url             = "https://www.epflracingteam.ch/en"
error_correction = "H"   # L · M · Q · H (higher = more damage tolerance, less data density)
box_size        = 40     # pixels per module
border          = 1      # quiet-zone width in modules (minimum 1)
fill_color      = "black"
back_color      = "white"

[logo]
path            = "assets/logo.png"
max_size_ratio  = 0.30   # logo width as a fraction of QR width
bg_padding_x    = 30     # white background horizontal padding around logo (px)
bg_padding_y    = 80     # white background vertical padding around logo (px)

[output]
path            = "out/qr_with_logo.png"
